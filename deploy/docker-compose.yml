# Remote-controllable traffic generator for the benchmark box (the NAS).
# Deployed once and left running; benchmark runs are triggered over HTTP,
# so measuring a new rung needs no redeploy.
#
#   cp .env.example .env   # set UDPBENCH_API_TOKEN
#   docker compose up -d
#
# Host networking is required: a bridge network would add its own
# forwarding layer and pollute the measurement. It also means the control
# API and the UDP sink bind directly to the host's ports.
services:
  udpbench:
    image: simondatastore:50000/udpbench:latest
    pull_policy: always
    network_mode: host
    restart: unless-stopped
    environment:
      # Leave empty to run without auth (only sane on a trusted LAN).
      UDPBENCH_API_TOKEN: "${UDPBENCH_API_TOKEN:-}"
    command:
      - serve
      - --port
      - "${API_PORT:-5390}"
    # The image has no curl/wget, so the healthcheck asks the API itself:
    # `udpbench health` exits non-zero when /healthz does not answer.
    healthcheck:
      test: ["CMD", "dotnet", "UdpBench.dll", "health", "--port", "${API_PORT:-5390}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
